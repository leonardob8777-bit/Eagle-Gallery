<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'">
<title>Aurora passcode</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}x-dc{display:none}</style>
<script>
/*
 * Eagle Passcode Theme Runtime
 * Renders a theme file (x-dc template + Component class) without any
 * external dependency and bridges key presses to Swift.
 *
 * Swift -> JS:  window.eagle.setCount(n)   // filled dots (0 = reset)
 *               window.eagle.shake()       // wrong-code feedback
 * JS -> Swift:  webkit.messageHandlers.eagle.postMessage({type, value})
 *               type: "digit" | "delete" | "cancel" | "ready"
 */
(function () {
  'use strict';

  // ---- base class used by every theme ---------------------------------
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const next = typeof patch === 'function' ? patch(this.state) : patch;
      this.state = Object.assign({}, this.state, next);
      if (this.__render) this.__render();
    }
    forceUpdate() { if (this.__render) this.__render(); }
  }
  window.DCLogic = DCLogic;

  // ---- bridge to Swift --------------------------------------------------
  function post(type, value) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.eagle) {
        window.webkit.messageHandlers.eagle.postMessage({ type: type, value: value == null ? null : String(value) });
      }
    } catch (e) { /* not inside WKWebView */ }
  }

  function classify(btn) {
    const label = (btn.getAttribute('aria-label') || btn.textContent || '').trim().toLowerCase();
    const digit = label.replace(/[\[\]\s]|k\d/g, '').match(/^\d$/);
    // the visible digit is the first text node; strip helper labels like "K7"
    const first = Array.from(btn.childNodes).filter(n => n.nodeType === 3).map(n => n.textContent).join('').replace(/[\[\]\s]/g, '');
    if (/^\d$/.test(first)) return { type: 'digit', value: first };
    if (digit) return { type: 'digit', value: digit[0] };
    if (/^(del|delete|erase|undo|⌫)$/.test(label)) return { type: 'delete' };
    if (/^(\^c|cancel|exit|run away|surface|emergency)$/.test(label)) return { type: 'cancel' };
    return null;
  }

  // ---- template helpers -------------------------------------------------
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    let v = scope;
    for (const part of path.split('.')) {
      if (v == null) return undefined;
      v = v[part];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, (_, p) => { const v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  // Build a fresh DOM fragment from the template for the given scope.
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'helmet') return;
    if (tag === 'sc-for') {
      const list = lookup(scope, (node.getAttribute('list') || '').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(c => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const v = lookup(scope, (node.getAttribute('value') || '').replace(/[{}]/g, ''));
      if (v) node.childNodes.forEach(c => build(c, scope, out));
      return;
    }
    const isSvg = node.namespaceURI === 'http://www.w3.org/2000/svg';
    const el = isSvg ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
    el.__handlers = {};
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name;
      if (name.startsWith('hint-')) continue;
      const whole = attr.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(name) && whole) {
        const fn = lookup(scope, whole[1]);
        if (typeof fn === 'function') el.__handlers[name.slice(2).toLowerCase()] = fn;
        continue;
      }
      try { el.setAttribute(name, interp(attr.value, scope)); } catch (e) {}
    }
    const kids = node.tagName.toLowerCase() === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach(c => build(c, scope, el));
    out.appendChild(el);
  }

  // Minimal DOM morph so running CSS animations are not restarted.
  function sameKind(a, b) { return a.nodeType === b.nodeType && (a.nodeType !== 1 || a.tagName === b.tagName); }
  function morph(oldParent, newParent) {
    const oldKids = Array.from(oldParent.childNodes);
    const newKids = Array.from(newParent.childNodes);
    newKids.forEach((nk, i) => {
      const ok = oldKids[i];
      if (!ok) { oldParent.appendChild(nk); attach(nk); return; }
      if (!sameKind(ok, nk)) { oldParent.replaceChild(nk, ok); attach(nk); return; }
      if (ok.nodeType === 3) { if (ok.textContent !== nk.textContent) ok.textContent = nk.textContent; return; }
      // attributes
      for (const a of Array.from(ok.attributes)) if (!nk.hasAttribute(a.name)) ok.removeAttribute(a.name);
      for (const a of Array.from(nk.attributes)) if (ok.getAttribute(a.name) !== a.value) ok.setAttribute(a.name, a.value);
      ok.__handlers = nk.__handlers;
      morph(ok, nk);
    });
    for (let i = newKids.length; i < oldKids.length; i++) oldParent.removeChild(oldKids[i]);
  }
  function attach(root) {
    if (root.nodeType !== 1) return;
    root.querySelectorAll('*').forEach(() => {});
  }

  // One delegated listener per event type keeps handlers fresh after morphs.
  function delegate(host) {
    ['click', 'input', 'change', 'pointerdown', 'pointerup'].forEach(type => {
      host.addEventListener(type, ev => {
        let n = ev.target;
        while (n && n !== host) {
          if (type === 'click' && n.tagName === 'BUTTON') {
            const c = classify(n);
            if (c) post(c.type, c.value);
          }
          const h = n.__handlers && n.__handlers[type];
          if (h) { h(ev); break; }
          n = n.parentNode;
        }
      });
    });
  }

  // ---- boot -------------------------------------------------------------
  function boot() {
    const xdc = document.querySelector('x-dc');
    const scriptEl = document.querySelector('script[data-dc-script]');
    if (!xdc || !scriptEl) return;

    // move <helmet> contents (fonts, keyframes) into <head>
    const helmet = xdc.querySelector('helmet');
    if (helmet) Array.from(helmet.childNodes).forEach(n => document.head.appendChild(n));

    const tpl = document.createElement('template');
    tpl.innerHTML = xdc.innerHTML;
    const helmetInTpl = tpl.content.querySelector('helmet');
    if (helmetInTpl) helmetInTpl.remove();

    // defaults from data-props, overridable by ?accent=%23ff0000 style params
    const props = {};
    try {
      const decl = JSON.parse(scriptEl.getAttribute('data-props') || '{}');
      Object.keys(decl).forEach(k => { if (k[0] !== '$' && 'default' in decl[k]) props[k] = decl[k].default; });
    } catch (e) {}
    new URLSearchParams(location.search).forEach((v, k) => { props[k] = v; });

    const Component = new Function('DCLogic', scriptEl.textContent + '\nreturn Component;')(DCLogic);
    const comp = new Component(props);
    comp.props = props;
    if (!comp.state) comp.state = {};

    const host = document.createElement('div');
    host.id = 'eagle-theme';
    host.style.cssText = 'width:100vw;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:flex-start';
    xdc.replaceWith(host);
    const stage = document.createElement('div');
    stage.style.transformOrigin = 'top center';
    host.appendChild(stage);
    delegate(host);

    function fit() {
      // themes are drawn at 390x844; scale to the device screen
      const s = Math.max(window.innerWidth / 390, window.innerHeight / 844);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    let first = true;
    comp.__render = function () {
      const vals = comp.renderVals ? comp.renderVals() : {};
      const frag = document.createElement('div');
      tpl.content.childNodes.forEach(c => build(c, vals, frag));
      if (first) { while (frag.firstChild) stage.appendChild(frag.firstChild); first = false; }
      else morph(stage, frag);
    };
    comp.__render();
    if (comp.componentDidMount) comp.componentDidMount();

    window.eagle = {
      setCount: function (n) { comp.setState({ n: Math.max(0, Math.min(6, n | 0)) }); },
      shake: function () {
        const a = stage.animate([
          { transform: stage.style.transform + ' translateX(0)' },
          { transform: stage.style.transform + ' translateX(-14px)' },
          { transform: stage.style.transform + ' translateX(12px)' },
          { transform: stage.style.transform + ' translateX(-8px)' },
          { transform: stage.style.transform + ' translateX(0)' }
        ], { duration: 380, easing: 'ease-out' });
        return a;
      }
    };
    post('ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9fffe0}a:hover{color:#d6fff2}
@keyframes auWave1{0%{transform:translateX(-12%) skewY(-8deg) scaleY(1);opacity:.55}50%{transform:translateX(10%) skewY(6deg) scaleY(1.35);opacity:.95}100%{transform:translateX(-12%) skewY(-8deg) scaleY(1);opacity:.55}}
@keyframes auWave2{0%{transform:translateX(14%) skewY(10deg) scaleY(1.2);opacity:.4}50%{transform:translateX(-10%) skewY(-4deg) scaleY(.85);opacity:.85}100%{transform:translateX(14%) skewY(10deg) scaleY(1.2);opacity:.4}}
@keyframes auWave3{0%,100%{transform:translateX(0) skewY(4deg);opacity:.3}50%{transform:translateX(-16%) skewY(-10deg);opacity:.7}}
@keyframes auSnow{0%{transform:translate(0,-30px)}50%{transform:translate(var(--d),430px)}100%{transform:translate(0,880px)}}
@keyframes auFlake{0%{transform:scale(0) rotate(-120deg);opacity:0}70%{transform:scale(1.4) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes auSpin{to{transform:rotate(360deg)}}
@keyframes auBreath{0%,100%{letter-spacing:10px;opacity:.75}50%{letter-spacing:14px;opacity:1}}
@keyframes auShine{0%,100%{opacity:.25}50%{opacity:.6}}
.auk{transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.auk:active{transform:scale(.9);background:rgba(159,255,224,.35) !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #020611 0%, #06142a 45%, #0b2236 100%); font-family: 'Josefin Sans', sans-serif; color: #eafff8">
<div aria-hidden="true" style="position: absolute; left: -40%; top: 40px; width: 180%; height: 240px; border-radius: 50%; background: linear-gradient(90deg, transparent 0%, {{tone}} 25%, #2de2c4 50%, #8a5cff 75%, transparent 100%); filter: blur(34px); mix-blend-mode: screen; animation: auWave1 11s ease-in-out infinite"></div>
<div aria-hidden="true" style="position: absolute; left: -40%; top: 150px; width: 180%; height: 180px; border-radius: 50%; background: linear-gradient(90deg, transparent 0%, #8a5cff 30%, {{tone}} 60%, transparent 100%); filter: blur(40px); mix-blend-mode: screen; animation: auWave2 14s ease-in-out infinite"></div>
<div aria-hidden="true" style="position: absolute; left: -30%; top: 0; width: 160%; height: 140px; border-radius: 50%; background: linear-gradient(90deg, transparent, #2de2c4, transparent); filter: blur(30px); mix-blend-mode: screen; animation: auWave3 9s ease-in-out infinite"></div>
<svg aria-hidden="true" style="position: absolute; left: 0; bottom: 0" width="390" height="190" viewBox="0 0 390 190"><path d="M0 120 L60 70 L95 98 L150 40 L210 104 L250 76 L300 118 L340 88 L390 112 V190 H0 Z" fill="#0d1d2e"></path><path d="M150 40 L172 64 L162 62 L150 72 L140 60 L130 62 Z" fill="#cfe9f2" opacity="0.6"></path><path d="M60 70 L74 82 L60 80 L50 86 Z" fill="#cfe9f2" opacity="0.5"></path><path d="M0 150 L80 118 L140 146 L220 116 L290 150 L390 128 V190 H0 Z" fill="#071321"></path></svg>
<sc-for list="{{snow}}" as="f" hint-placeholder-count="24">
<span aria-hidden="true" style="position: absolute; left: {{f.x}}px; top: 0; width: {{f.s}}px; height: {{f.s}}px; border-radius: 50%; background: #ffffff; opacity: {{f.o}}; --d: {{f.d}}px; animation: auSnow {{f.dur}}s linear {{f.delay}}s infinite"></span>
</sc-for>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 300px 30px 0">
<p style="margin: 0; font-size: 15px; font-weight: 200; text-transform: uppercase; animation: auBreath 6s ease-in-out infinite">Unlock</p>
<div style="display: flex; gap: 16px; margin-top: 18px; height: 18px; align-items: center">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
<span style="display: block; width: 16px; height: 16px; animation: auFlake .5s ease-out both"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{tone}}" stroke-width="2.2" stroke-linecap="round" style="animation: auSpin 8s linear infinite; filter: drop-shadow(0 0 4px {{tone}})"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"></path></svg></span>
</sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
<span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(234,255,248,0.35)"></span>
</sc-if>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; margin-top: 34px; width: 100%">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
<button class="auk" onClick="{{k.press}}" style="position: relative; height: 82px; clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%); background: linear-gradient(170deg, rgba(234,255,248,0.28), rgba(234,255,248,0.05) 60%); border: 0; color: #eafff8; font-family: 'Josefin Sans', sans-serif; font-size: 30px; font-weight: 200; cursor: pointer">{{k.label}}<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%); animation: auShine 4s ease-in-out {{k.delay}}s infinite; pointer-events: none"></span></button>
</sc-for>
<button onClick="{{clear}}" style="height: 82px; background: none; border: 0; color: #9fd8c8; font-family: 'Josefin Sans', sans-serif; font-size: 15px; letter-spacing: 2px; cursor: pointer">CANCEL</button>
<button class="auk" onClick="{{press}}" style="height: 82px; clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%); background: linear-gradient(170deg, rgba(234,255,248,0.28), rgba(234,255,248,0.05) 60%); border: 0; color: #eafff8; font-family: 'Josefin Sans', sans-serif; font-size: 30px; font-weight: 200; cursor: pointer">0</button>
<button onClick="{{back}}" style="height: 82px; background: none; border: 0; color: #9fd8c8; font-family: 'Josefin Sans', sans-serif; font-size: 15px; letter-spacing: 2px; cursor: pointer">DELETE</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"color","default":"#3dffa8","options":["#3dffa8","#ff5ec4","#5ec8ff","#ffd36b"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { n: 0 }; }
renderVals() {
const n = this.state.n;
const press = () => this.setState({ n: n >= 6 ? 1 : n + 1 });
const snow = [];
for (let i = 0; i < 24; i++) {
snow.push({ x: (i * 53) % 390, s: 2 + (i % 3), o: (0.35 + (i % 4) * 0.15).toFixed(2), d: ((i % 2 ? 1 : -1) * (10 + (i % 5) * 6)), dur: (9 + (i * 1.7) % 8).toFixed(1), delay: (-((i * 2.3) % 14)).toFixed(1) });
}
return {
tone: this.props.tone ?? '#3dffa8',
snow,
dots: [0,1,2,3,4,5].map(i => ({ on: i < n, off: i >= n })),
keys: ['1','2','3','4','5','6','7','8','9'].map((label, i) => ({ label, press, delay: (i * 0.3).toFixed(1) })),
press,
back: () => this.setState({ n: Math.max(0, n - 1) }),
clear: () => this.setState({ n: 0 })
};
}
}
</script>
</body>
</html>
