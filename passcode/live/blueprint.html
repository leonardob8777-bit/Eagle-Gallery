<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'">
<title>Blueprint passcode</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}x-dc{display:none}</style>
<script>
/*
 * Eagle Passcode Theme Runtime
 * Renders a theme file (x-dc template + Component class) without any
 * external dependency and bridges key presses to Swift.
 *
 * Swift -> JS:  window.eagle.setCount(n)   // filled dots (0 = reset)
 *               window.eagle.shake()       // wrong-code feedback
 * JS -> Swift:  webkit.messageHandlers.eagle.postMessage({type, value})
 *               type: "digit" | "delete" | "cancel" | "ready"
 */
(function () {
  'use strict';

  // ---- base class used by every theme ---------------------------------
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const next = typeof patch === 'function' ? patch(this.state) : patch;
      this.state = Object.assign({}, this.state, next);
      if (this.__render) this.__render();
    }
    forceUpdate() { if (this.__render) this.__render(); }
  }
  window.DCLogic = DCLogic;

  // ---- bridge to Swift --------------------------------------------------
  function post(type, value) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.eagle) {
        window.webkit.messageHandlers.eagle.postMessage({ type: type, value: value == null ? null : String(value) });
      }
    } catch (e) { /* not inside WKWebView */ }
  }

  function classify(btn) {
    const label = (btn.getAttribute('aria-label') || btn.textContent || '').trim().toLowerCase();
    const digit = label.replace(/[\[\]\s]|k\d/g, '').match(/^\d$/);
    // the visible digit is the first text node; strip helper labels like "K7"
    const first = Array.from(btn.childNodes).filter(n => n.nodeType === 3).map(n => n.textContent).join('').replace(/[\[\]\s]/g, '');
    if (/^\d$/.test(first)) return { type: 'digit', value: first };
    if (digit) return { type: 'digit', value: digit[0] };
    if (/^(del|delete|erase|undo|⌫)$/.test(label)) return { type: 'delete' };
    if (/^(\^c|cancel|exit|run away|surface|emergency)$/.test(label)) return { type: 'cancel' };
    return null;
  }

  // ---- template helpers -------------------------------------------------
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    let v = scope;
    for (const part of path.split('.')) {
      if (v == null) return undefined;
      v = v[part];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, (_, p) => { const v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  // Build a fresh DOM fragment from the template for the given scope.
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'helmet') return;
    if (tag === 'sc-for') {
      const list = lookup(scope, (node.getAttribute('list') || '').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(c => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const v = lookup(scope, (node.getAttribute('value') || '').replace(/[{}]/g, ''));
      if (v) node.childNodes.forEach(c => build(c, scope, out));
      return;
    }
    const isSvg = node.namespaceURI === 'http://www.w3.org/2000/svg';
    const el = isSvg ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
    el.__handlers = {};
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name;
      if (name.startsWith('hint-')) continue;
      const whole = attr.value.match(WHOLE);
      if (/^on[a-z]+$/i.test(name) && whole) {
        const fn = lookup(scope, whole[1]);
        if (typeof fn === 'function') el.__handlers[name.slice(2).toLowerCase()] = fn;
        continue;
      }
      try { el.setAttribute(name, interp(attr.value, scope)); } catch (e) {}
    }
    const kids = node.tagName.toLowerCase() === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach(c => build(c, scope, el));
    out.appendChild(el);
  }

  // Minimal DOM morph so running CSS animations are not restarted.
  function sameKind(a, b) { return a.nodeType === b.nodeType && (a.nodeType !== 1 || a.tagName === b.tagName); }
  function morph(oldParent, newParent) {
    const oldKids = Array.from(oldParent.childNodes);
    const newKids = Array.from(newParent.childNodes);
    newKids.forEach((nk, i) => {
      const ok = oldKids[i];
      if (!ok) { oldParent.appendChild(nk); attach(nk); return; }
      if (!sameKind(ok, nk)) { oldParent.replaceChild(nk, ok); attach(nk); return; }
      if (ok.nodeType === 3) { if (ok.textContent !== nk.textContent) ok.textContent = nk.textContent; return; }
      // attributes
      for (const a of Array.from(ok.attributes)) if (!nk.hasAttribute(a.name)) ok.removeAttribute(a.name);
      for (const a of Array.from(nk.attributes)) if (ok.getAttribute(a.name) !== a.value) ok.setAttribute(a.name, a.value);
      ok.__handlers = nk.__handlers;
      morph(ok, nk);
    });
    for (let i = newKids.length; i < oldKids.length; i++) oldParent.removeChild(oldKids[i]);
  }
  function attach(root) {
    if (root.nodeType !== 1) return;
    root.querySelectorAll('*').forEach(() => {});
  }

  // One delegated listener per event type keeps handlers fresh after morphs.
  function delegate(host) {
    ['click', 'input', 'change', 'pointerdown', 'pointerup'].forEach(type => {
      host.addEventListener(type, ev => {
        let n = ev.target;
        while (n && n !== host) {
          if (type === 'click' && n.tagName === 'BUTTON') {
            const c = classify(n);
            if (c) post(c.type, c.value);
          }
          const h = n.__handlers && n.__handlers[type];
          if (h) { h(ev); break; }
          n = n.parentNode;
        }
      });
    });
  }

  // ---- boot -------------------------------------------------------------
  function boot() {
    const xdc = document.querySelector('x-dc');
    const scriptEl = document.querySelector('script[data-dc-script]');
    if (!xdc || !scriptEl) return;

    // move <helmet> contents (fonts, keyframes) into <head>
    const helmet = xdc.querySelector('helmet');
    if (helmet) Array.from(helmet.childNodes).forEach(n => document.head.appendChild(n));

    const tpl = document.createElement('template');
    tpl.innerHTML = xdc.innerHTML;
    const helmetInTpl = tpl.content.querySelector('helmet');
    if (helmetInTpl) helmetInTpl.remove();

    // defaults from data-props, overridable by ?accent=%23ff0000 style params
    const props = {};
    try {
      const decl = JSON.parse(scriptEl.getAttribute('data-props') || '{}');
      Object.keys(decl).forEach(k => { if (k[0] !== '$' && 'default' in decl[k]) props[k] = decl[k].default; });
    } catch (e) {}
    new URLSearchParams(location.search).forEach((v, k) => { props[k] = v; });

    const Component = new Function('DCLogic', scriptEl.textContent + '\nreturn Component;')(DCLogic);
    const comp = new Component(props);
    comp.props = props;
    if (!comp.state) comp.state = {};

    const host = document.createElement('div');
    host.id = 'eagle-theme';
    host.style.cssText = 'width:100vw;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:flex-start';
    xdc.replaceWith(host);
    const stage = document.createElement('div');
    stage.style.transformOrigin = 'top center';
    host.appendChild(stage);
    delegate(host);

    function fit() {
      // themes are drawn at 390x844; scale to the device screen
      const s = Math.max(window.innerWidth / 390, window.innerHeight / 844);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    let first = true;
    comp.__render = function () {
      const vals = comp.renderVals ? comp.renderVals() : {};
      const frag = document.createElement('div');
      tpl.content.childNodes.forEach(c => build(c, vals, frag));
      if (first) { while (frag.firstChild) stage.appendChild(frag.firstChild); first = false; }
      else morph(stage, frag);
    };
    comp.__render();
    if (comp.componentDidMount) comp.componentDidMount();

    window.eagle = {
      setCount: function (n) { comp.setState({ n: Math.max(0, Math.min(6, n | 0)) }); },
      shake: function () {
        const a = stage.animate([
          { transform: stage.style.transform + ' translateX(0)' },
          { transform: stage.style.transform + ' translateX(-14px)' },
          { transform: stage.style.transform + ' translateX(12px)' },
          { transform: stage.style.transform + ' translateX(-8px)' },
          { transform: stage.style.transform + ' translateX(0)' }
        ], { duration: 380, easing: 'ease-out' });
        return a;
      }
    };
    post('ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#d8e6ff}
@keyframes bpDraw{to{stroke-dashoffset:0}}
@keyframes bpSpin{to{transform:rotate(360deg)}}
@keyframes bpSpinBack{to{transform:rotate(-360deg)}}
@keyframes bpScan{0%{transform:translateY(0)}50%{transform:translateY(560px)}100%{transform:translateY(0)}}
@keyframes bpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bpCross{0%{transform:translate(40px,640px)}25%{transform:translate(300px,600px)}50%{transform:translate(260px,420px)}75%{transform:translate(70px,470px)}100%{transform:translate(40px,640px)}}
@keyframes bpTick{0%,100%{opacity:.35}50%{opacity:1}}
.bpk{transition:background .15s,color .15s}
.bpk:active{background:#ffffff !important;color:#0b3d91 !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background-color: {{paper}}; background-image: linear-gradient(rgba(255,255,255,0.16) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.16) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px; font-family: 'IBM Plex Mono', monospace; color: #ffffff">
<div aria-hidden="true" style="position: absolute; right: 22px; top: 58px; width: 74px; height: 74px; animation: bpSpin 14s linear infinite">
<svg width="74" height="74" viewBox="0 0 74 74" fill="none" stroke="#ffffff" stroke-width="1.5"><circle cx="37" cy="37" r="22"></circle><circle cx="37" cy="37" r="7"></circle><path d="M37 6v9M37 59v9M6 37h9M59 37h9M15 15l6 6M53 53l6 6M15 59l6-6M53 21l6-6"></path></svg>
</div>
<div aria-hidden="true" style="position: absolute; right: 88px; top: 36px; width: 40px; height: 40px; animation: bpSpinBack 7s linear infinite">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"><circle cx="20" cy="20" r="11"></circle><circle cx="20" cy="20" r="3"></circle><path d="M20 2v7M20 31v7M2 20h7M31 20h7"></path></svg>
</div>
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0" width="390" height="844" viewBox="0 0 390 844" fill="none" stroke="#ffffff">
<rect x="22" y="300" width="346" height="460" stroke-width="1.5" stroke-dasharray="1612" stroke-dashoffset="1612" style="animation: bpDraw 2.2s ease-out .2s forwards"></rect>
<path d="M22 784 H368 M22 778 V790 M368 778 V790" stroke-width="1" stroke-dasharray="370" stroke-dashoffset="370" style="animation: bpDraw 1s ease-out 2s forwards"></path>
<path d="M380 300 V760 M374 300 H386 M374 760 H386" stroke-width="1" stroke-dasharray="480" stroke-dashoffset="480" style="animation: bpDraw 1s ease-out 2.3s forwards"></path>
<path d="M22 60 L120 60 M22 54 V66" stroke-width="1" stroke-dasharray="110" stroke-dashoffset="110" style="animation: bpDraw .8s ease-out .1s forwards"></path>
</svg>
<p aria-hidden="true" style="position: absolute; left: 160px; top: 790px; margin: 0; font-size: 10px; opacity: 0; animation: bpIn .5s ease-out 2.8s forwards">346.00</p>
<p aria-hidden="true" style="position: absolute; left: 340px; top: 520px; margin: 0; font-size: 10px; transform: rotate(-90deg); opacity: 0; animation: bpIn .5s ease-out 3s forwards">460.00</p>
<div aria-hidden="true" style="position: absolute; left: 22px; right: 22px; top: 300px; height: 1px; background: #ffffff; box-shadow: 0 0 8px #ffffff; opacity: .55; animation: bpScan 7s ease-in-out 2.4s infinite"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; animation: bpCross 12s ease-in-out infinite">
<svg width="22" height="22" viewBox="0 0 22 22" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5"><path d="M11 0v22M0 11h22"></path><circle cx="11" cy="11" r="4"></circle></svg>
</div>
<div style="position: relative; display: flex; flex-direction: column; padding: 76px 34px 0">
<p style="margin: 0; font-size: 10px; letter-spacing: 3px; opacity: .8">SHEET 01 / 09 · EAGLE</p>
<h1 style="margin: 30px 0 0; font-size: 26px; font-weight: 600; letter-spacing: 1px; animation: bpIn .6s ease-out .3s both">ENTER PASSCODE</h1>
<p style="margin: 8px 0 0; font-family: 'Architects Daughter', cursive; font-size: 15px; opacity: .9; animation: bpIn .6s ease-out .9s both">6 digits — draw carefully</p>
<div style="display: flex; gap: 14px; margin-top: 30px; height: 20px; align-items: center">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="10" cy="10" r="7" stroke-dasharray="44" stroke-dashoffset="44" style="animation: bpDraw .35s ease-out forwards"></circle><circle cx="10" cy="10" r="3" fill="#ffffff" stroke="none" style="opacity: 0; animation: bpIn .2s ease-out .3s forwards"></circle></svg>
</sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"><circle cx="10" cy="10" r="7"></circle></svg>
</sc-if>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 62px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
<button class="bpk" onClick="{{k.press}}" style="position: relative; height: 84px; background: rgba(255,255,255,0.04); border: 1.5px solid #ffffff; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 30px; cursor: pointer; animation: bpIn .4s ease-out {{k.delay}}s both">{{k.label}}<span aria-hidden="true" style="position: absolute; left: 6px; top: 4px; font-size: 9px; animation: bpTick 3s ease-in-out {{k.delay}}s infinite">K{{k.label}}</span></button>
</sc-for>
<button onClick="{{clear}}" style="height: 84px; background: none; border: 1px dashed rgba(255,255,255,0.6); color: #ffffff; font-family: 'Architects Daughter', cursive; font-size: 16px; cursor: pointer">cancel</button>
<button class="bpk" onClick="{{press}}" style="position: relative; height: 84px; background: rgba(255,255,255,0.04); border: 1.5px solid #ffffff; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 30px; cursor: pointer; animation: bpIn .4s ease-out 1.9s both">0<span aria-hidden="true" style="position: absolute; left: 6px; top: 4px; font-size: 9px">K0</span></button>
<button onClick="{{back}}" style="height: 84px; background: none; border: 1px dashed rgba(255,255,255,0.6); color: #ffffff; font-family: 'Architects Daughter', cursive; font-size: 16px; cursor: pointer">erase</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#0b3d91","options":["#0b3d91","#14213d","#7a1f2b","#1d4d3a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { n: 0 }; }
renderVals() {
const n = this.state.n;
const press = () => this.setState({ n: n >= 6 ? 1 : n + 1 });
return {
paper: this.props.paper ?? '#0b3d91',
dots: [0,1,2,3,4,5].map(i => ({ on: i < n, off: i >= n })),
keys: ['1','2','3','4','5','6','7','8','9'].map((label, i) => ({ label, press, delay: (1.2 + i * 0.07).toFixed(2) })),
press,
back: () => this.setState({ n: Math.max(0, n - 1) }),
clear: () => this.setState({ n: 0 })
};
}
}
</script>
</body>
</html>
